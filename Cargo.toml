[workspace]
resolver = "3"
members = [
  "src/api", "src/kernel",
  "src/main",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/tacticasystems/tactica"
authors = ["Tactica Team"]

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
anyhow = "1.0"
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
figment = { version = "0.10", features = ["env"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["request-id", "trace", "cors", "timeout", "limit"] }
url = { version = "2.5", features = ["serde"] }
http = "1.5"

# Core Components
tactica-api.path = "./src/api"
tactica-db.path = "./src/db"
tactica-kernel.path = "./src/kernel"
